[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapitestcurd"
version = "0.1.0"
description = "Python for AI: FastAPI + SQL Server backend, pandas utilities, and LangChain agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyodbc>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]
agents = [
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "langgraph-cli[inmem]>=0.4",
    "langserve>=0.3",
    "langsmith>=0.4",
    "google-search-results>=2.4",
    "python-dotenv>=1.0",
    "sse-starlette>=2.0",
]

[project.scripts]
clean-dataset = "datautils.cli:main"
init-db = "db.init_db:main"
agent-chat = "agents.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
db = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
